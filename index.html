<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilde Graph Architect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- Floating Control Panel -->
        <aside class="control-panel">
          <div class="panel-view editor-view" id="editorView">
            <!-- Presets Section -->
            <section class="panel-section presets-section">
                <h2 class="section-title">Presets</h2>
                <div class="presets-grid" id="presetsGrid">
                    <!-- Presets will be generated by JS -->
                </div>
            </section>

            <!-- Controls Section -->
            <section class="panel-section controls-section">
                <div class="control-group">
                    <label class="control-label">Nodes per column</label>
                    <div class="nodes-input-row">
                        <input type="text" id="nodesInput" class="nodes-text-input" value="8, 3, 8" placeholder="8, 3, 8" aria-label="Nodes per column">
                        <button class="btn-icon" id="randomizeBtn" title="Randomize" aria-label="Randomize nodes per column">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M2 4h3.5l5 8H14M14 4h-3.5l-2 3.2M5.5 12H2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="14" cy="4" r="1.5" fill="currentColor"/>
                                <circle cx="14" cy="12" r="1.5" fill="currentColor"/>
                            </svg>
                        </button>
                        <button class="btn-icon" id="resetBtn" title="Reset" aria-label="Reset generator">
                            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                <path d="M3.1 5.4A5.5 5.5 0 1 1 2.5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M2.2 2.8v3.3h3.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label" for="columnSpacing">Width</label>
                        <input type="range" id="columnSpacing" class="slider" min="0.05" max="1.5" step="0.05" value="1">
                        <span class="value-pill" id="columnSpacingValue">100%</span>
                    </div>
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label" for="rowSpacing">Height</label>
                    <input type="range" id="rowSpacing" class="slider" min="0.05" max="1.5" step="0.05" value="1">
                        <span class="value-pill" id="rowSpacingValue">100%</span>
                    </div>
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label" for="nodeBaseSize">Node size</label>
                        <input type="range" id="nodeBaseSize" class="slider" min="0" max="20" step="0.5" value="6">
                        <span class="value-pill" id="nodeBaseSizeValue">6</span>
                    </div>
                </div>
            </section>

            <section class="motion-section">
                <h2 class="motion-title">Animation</h2>
                <div class="motion-controls" id="motionControls">
                    <div class="motion-topline">
                        <label class="motion-check"><input id="animationEnabled" type="checkbox" checked> Live preview</label>
                        <div class="motion-actions">
                            <button id="playPauseBtn" type="button">Pause</button>
                            <button id="restartAnimationBtn" type="button" aria-label="Restart animation">↻</button>
                        </div>
                    </div>

                    <div class="motion-row">
                        <label for="animationDuration">Duration</label>
                        <input id="animationDuration" class="motion-slider" type="range" min="3" max="18" step="0.5" value="6">
                        <output id="animationDurationValue">6s</output>
                    </div>
                    <div class="motion-row">
                        <label for="waveWidth">Cluster</label>
                        <input id="waveWidth" class="motion-slider" type="range" min="0.35" max="2" step="0.05" value="0.4">
                        <output id="waveWidthValue">0.40</output>
                    </div>
                    <div class="motion-row">
                        <label for="fadeSpeed">Fade</label>
                        <input id="fadeSpeed" class="motion-slider" type="range" min="0.5" max="8" step="0.5" value="5">
                        <output id="fadeSpeedValue">5×</output>
                    </div>

                    <label class="motion-field" for="wavePattern">
                        <span>Pattern</span>
                        <select id="wavePattern">
                            <option value="sequence">Sequence</option>
                            <option value="radial">Radial</option>
                            <option value="diagonal-forward">Diagonal /</option>
                            <option value="diagonal-back">Diagonal \</option>
                        </select>
                    </label>

                    <button class="colors-entry" id="openColorsBtn" type="button">
                        <span>Colors</span>
                        <span class="colors-entry-preview" aria-hidden="true">
                            <i style="--swatch:#AFAFAF"></i><i style="--swatch:#646464"></i><i style="--swatch:#FFFFFF"></i>
                        </span>
                        <span class="colors-entry-arrow" aria-hidden="true">›</span>
                    </button>
                </div>
            </section>

            <!-- SVG actions - At bottom of sidebar -->
            <div class="svg-actions">
                <button class="btn-copy" id="copyBtn">Copy</button>
                <button class="btn-export" id="downloadBtn">Export</button>
            </div>
          </div>

          <section class="panel-view color-view" id="colorView" aria-labelledby="colorTitle" hidden>
              <header class="export-header">
                  <div>
                      <p class="export-eyebrow">Appearance</p>
                      <h2 id="colorTitle">Colors</h2>
                  </div>
                  <button class="export-close" id="closeColorsBtn" type="button" aria-label="Close color settings">×</button>
              </header>

              <fieldset class="color-mode">
                  <legend>Node color</legend>
                  <div class="segmented-control">
                      <label><input type="radio" name="nodeColorMode" value="uniform" checked><span>Uniform</span></label>
                      <label><input type="radio" name="nodeColorMode" value="connections"><span>Connections</span></label>
                      <label><input type="radio" name="nodeColorMode" value="vibrant"><span>Vibrant</span></label>
                  </div>
              </fieldset>

              <div class="color-fields">
                  <label class="color-field">
                      <span><strong>Lines</strong><small>Graph structure</small></span>
                      <input id="lineColor" type="color" value="#AFAFAF">
                  </label>

                  <div class="uniform-color-fields" id="uniformColorFields">
                      <label class="color-field">
                          <span><strong>Off nodes</strong><small>Resting color</small></span>
                          <input id="inactiveNodeColor" type="color" value="#646464">
                      </label>
                  </div>

                  <div class="connection-color-fields" id="connectionColorFields" hidden>
                      <div class="connection-gradient" id="connectionGradient" aria-hidden="true"></div>
                      <div class="gradient-labels"><span>Fewer</span><span>More</span></div>
                      <label class="color-field">
                          <span><strong>Fewer</strong><small>Low connection count</small></span>
                          <input id="connectionLowColor" type="color" value="#30394A">
                      </label>
                      <label class="color-field">
                          <span><strong>More</strong><small>High connection count</small></span>
                          <input id="connectionHighColor" type="color" value="#AFF3F8">
                      </label>
                  </div>

                  <div class="vibrant-color-fields" id="vibrantColorFields" hidden>
                      <div class="vibrant-palette" aria-label="Degree colors: 4 red, 6 orange, 8 yellow, 9 green, 10 teal, 12 blue, 14 purple, 16 or more pink">
                          <i style="--tone:#FF1111"><span>4</span></i>
                          <i style="--tone:#FF7417"><span>6</span></i>
                          <i style="--tone:#FFD31A"><span>8</span></i>
                          <i style="--tone:#58F20B"><span>9</span></i>
                          <i style="--tone:#149797"><span>10</span></i>
                          <i style="--tone:#3120DF"><span>12</span></i>
                          <i style="--tone:#9A3FD1"><span>14</span></i>
                          <i style="--tone:#E65FBD"><span>16+</span></i>
                      </div>
                      <p class="vibrant-note">Discrete color by node degree</p>
                  </div>

                  <label class="color-field">
                      <span><strong>On nodes</strong><small>Wave highlight</small></span>
                      <input id="activeNodeColor" type="color" value="#FFFFFF">
                  </label>
              </div>

              <div class="color-actions">
                  <button class="btn-export" id="doneColorsBtn" type="button">Done</button>
              </div>
          </section>

          <section class="panel-view export-view" id="exportView" aria-labelledby="exportTitle" hidden>
              <header class="export-header">
                  <div>
                      <p class="export-eyebrow">Output</p>
                      <h2 id="exportTitle">Export</h2>
                  </div>
                  <button class="export-close" id="closeExportBtn" type="button" aria-label="Close export settings">×</button>
              </header>

              <fieldset class="format-options">
                  <legend>Format</legend>
                  <label class="format-option">
                      <input type="radio" name="exportFormat" value="svg">
                      <span class="format-copy"><strong>SVG</strong><small>Static vector</small></span>
                      <span class="format-mark" aria-hidden="true"></span>
                  </label>
                  <label class="format-option">
                      <input type="radio" name="exportFormat" value="webm">
                      <span class="format-copy"><strong>WebM</strong><small>Animated · one seamless loop</small></span>
                      <span class="format-mark" aria-hidden="true"></span>
                  </label>
                  <label class="format-option">
                      <input type="radio" name="exportFormat" value="mp4" checked>
                      <span class="format-copy"><strong>MP4</strong><small>2160 × 2160 · best for social</small></span>
                      <span class="format-badge">Recommended</span>
                  </label>
              </fieldset>

              <div class="export-summary" id="exportSummary">
                  <span>MP4</span>
                  <span>2160 × 2160 · 30 fps · 6s</span>
              </div>

              <div class="export-actions">
                  <button class="btn-copy" id="cancelExportBtn" type="button">Cancel</button>
                  <button class="btn-export" id="confirmExportBtn" type="button">Export</button>
              </div>
          </section>
        </aside>

        <!-- Canvas Area -->
        <main class="canvas-area">
            <div class="canvas-wrapper">
                <div id="preview" class="preview"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <script src="graph.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="generator-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050607">
    <meta name="description" content="An interactive graph system for Tilde Research.">
    <title>Tilde Research — Graph Architect</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="generator-page">
    <section class="generator" data-tilde-generator data-mode="standalone">
        <main class="canvas-area" aria-label="Generated graph preview">
            <div class="preview" data-preview></div>
        </main>

        <aside class="control-panel" aria-label="Graph controls">
            <div class="panel-header">
                <h1>Graph</h1>
                <button class="text-button" type="button" data-action="reset">Reset</button>
            </div>

            <section class="panel-section" aria-label="Graph structure">
                <div class="control-group control-row">
                    <label class="control-label" for="complexity">Complexity</label>
                    <input type="range" id="complexity" class="slider" min="1" max="9" step="1" value="5">
                    <output class="value-output" id="complexityValue" for="complexity">5</output>
                </div>

                <div class="control-group control-row">
                    <label class="control-label" for="columnSpacing">Width</label>
                    <input type="range" id="columnSpacing" class="slider" min="0.35" max="1.5" step="0.05" value="1">
                    <output class="value-output" id="columnSpacingValue" for="columnSpacing">1.00</output>
                </div>

                <div class="control-group control-row">
                    <label class="control-label" for="rowSpacing">Height</label>
                    <input type="range" id="rowSpacing" class="slider" min="0.35" max="1.5" step="0.05" value="1">
                    <output class="value-output" id="rowSpacingValue" for="rowSpacing">1.00</output>
                </div>

                <div class="control-group control-row">
                    <label class="control-label" for="nodeBaseSize">Node size</label>
                    <input type="range" id="nodeBaseSize" class="slider" min="2" max="18" step="0.5" value="8">
                    <output class="value-output" id="nodeBaseSizeValue" for="nodeBaseSize">8</output>
                </div>
            </section>

            <div class="panel-actions">
                <button class="secondary-button" type="button" data-action="randomize">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M2 4h3.5l5 8H14M14 4h-3.5l-2 3.2M5.5 12H2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12.5 2.5L14 4l-1.5 1.5M12.5 10.5L14 12l-1.5 1.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Shuffle
                </button>
                <button class="primary-button" type="button" data-action="download">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M8 1.5v8M8 9.5L4.75 6.25M8 9.5l3.25-3.25M2.25 12v2.25h11.5V12" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span data-download-label>Export SVG</span>
                </button>
            </div>
        </aside>

        <div class="chrome-actions">
            <span class="live-badge"><span class="live-dot" aria-hidden="true"></span>Interactive</span>
            <button class="icon-button fullscreen-button" type="button" data-action="fullscreen" aria-label="Enter full screen" title="Full screen">
                <svg class="fullscreen-enter" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg class="fullscreen-exit" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="preset-drawer" data-preset-drawer hidden>
            <div class="preset-drawer-header">
                <h2>All structures</h2>
                <button class="icon-button drawer-close" type="button" data-action="close-presets" aria-label="Close all structures">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                        <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="presets-grid" data-presets></div>
        </div>

        <nav class="mode-switcher" aria-label="Graph structures">
            <div class="primary-presets" data-primary-presets></div>
            <button class="mode-button more-button" type="button" data-action="toggle-presets" aria-expanded="false">
                See more
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </nav>

        <input type="hidden" id="nodesInput" value="1,5,3,5,1">

        <div class="toast" role="status" aria-live="polite" data-toast></div>
    </section>

    <script src="graph.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilde Graph Architect</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- Floating Control Panel -->
        <aside class="control-panel">
            <!-- Panel Header with Logo -->
            <div class="panel-header">
                <div class="logo-wrapper">
                    <svg class="logo-icon" width="32" height="33" viewBox="0 0 32 33" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.5974 16.622L29.1731 12.3661C29.9459 11.8657 30.9773 12.0864 31.4778 12.8592C31.9783 13.6321 31.7575 14.6634 30.9847 15.1639L23.0434 20.3074L9.51873 15.5994L2.53941 19.8856C1.75499 20.3672 0.728809 20.122 0.246857 19.3378C-0.234923 18.5532 0.00994126 17.5256 0.794582 17.0438L9.12273 11.9307L22.5974 16.622Z" fill="currentColor"/>
                        <path d="M22.5974 4.69132L29.1731 0.435449C29.9459 -0.0650095 30.9773 0.155741 31.4778 0.928553C31.9783 1.70141 31.7575 2.73278 30.9847 3.23325L23.0434 8.3767L9.51873 3.66869L2.53941 7.95491C1.75499 8.43655 0.728809 8.19129 0.246857 7.40718C-0.234923 6.62254 0.00994126 5.59489 0.794582 5.11311L9.12273 0L22.5974 4.69132Z" fill="currentColor"/>
                        <path d="M22.5974 28.5536L29.1731 24.2978C29.9459 23.7973 30.9773 24.018 31.4778 24.7909C31.9783 25.5637 31.7575 26.5951 30.9847 27.0955L23.0434 32.239L9.51873 27.531L2.53941 31.8172C1.75499 32.2989 0.728809 32.0536 0.246857 31.2695C-0.234923 30.4848 0.00994126 29.4572 0.794582 28.9754L9.12273 23.8623L22.5974 28.5536Z" fill="currentColor"/>
                    </svg>
                    <span class="logo">Tilde Graph Architect</span>
                </div>
            </div>

            <!-- Presets Section -->
            <section class="panel-section presets-section">
                <h2 class="section-title">Presets</h2>
                <div class="presets-grid" id="presetsGrid">
                    <!-- Presets will be generated by JS -->
                </div>
            </section>

            <!-- Controls Section -->
            <section class="panel-section controls-section">
                <div class="control-group">
                    <label class="control-label">Nodes per column</label>
                    <div class="nodes-input-row">
                        <input type="text" id="nodesInput" class="nodes-text-input" value="1,5,3,5,1" placeholder="1,5,3,5,1">
                        <button class="btn-icon" id="randomizeBtn" title="Randomize">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M2 4h3.5l5 8H14M14 4h-3.5l-2 3.2M5.5 12H2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="14" cy="4" r="1.5" fill="currentColor"/>
                                <circle cx="14" cy="12" r="1.5" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label">Column spacing</label>
                        <span class="value-pill" id="columnSpacingValue">1.00</span>
                    </div>
                    <input type="range" id="columnSpacing" class="slider" min="0" max="1.5" step="0.05" value="1">
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label">Row spacing</label>
                        <span class="value-pill" id="rowSpacingValue">1.00</span>
                    </div>
                    <input type="range" id="rowSpacing" class="slider" min="0" max="1.5" step="0.05" value="1">
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label">Line thickness</label>
                        <span class="value-pill" id="lineThicknessValue">0.50</span>
                    </div>
                    <input type="range" id="lineThickness" class="slider" min="0.1" max="10" step="0.1" value="0.5">
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label">Node size</label>
                        <span class="value-pill" id="nodeBaseSizeValue">8.00</span>
                    </div>
                    <input type="range" id="nodeBaseSize" class="slider" min="0" max="20" step="0.5" value="8">
                </div>

                <div class="control-group">
                    <div class="slider-row">
                        <label class="control-label">Node scale</label>
                        <span class="value-pill" id="nodeScaleKValue">1.00</span>
                    </div>
                    <input type="range" id="nodeScaleK" class="slider" min="0" max="5" step="0.1" value="1">
                </div>

                <div class="control-group color-group">
                    <label class="control-label">Line color</label>
                    <div class="color-row">
                        <input type="color" id="lineColor" class="color-chip" value="#F3F3F4">
                        <input type="text" id="lineColorHex" class="color-hex" value="#F3F3F4">
                    </div>
                </div>

                <div class="control-group color-group">
                    <label class="control-label">Node color</label>
                    <div class="color-row">
                        <input type="color" id="nodeColor" class="color-chip" value="#F3F3F4">
                        <input type="text" id="nodeColorHex" class="color-hex" value="#F3F3F4">
                    </div>
                </div>

                <div class="control-group color-group">
                    <label class="control-label">Background</label>
                    <div class="color-row">
                        <input type="color" id="bgColor" class="color-chip" value="#010204">
                        <input type="text" id="bgColorHex" class="color-hex" value="#010204">
                    </div>
                </div>
            </section>

            <!-- Advanced Section -->
            <section class="panel-section collapsible-section" data-section="advanced">
                <button class="section-header" data-expanded="false">
                    <span>Advanced</span>
                    <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="section-content collapsed">
                    <div class="control-group">
                        <div class="slider-row">
                            <label class="control-label">Merge tolerance</label>
                            <span class="value-pill" id="mergeToleranceValue">1.00</span>
                        </div>
                        <input type="range" id="mergeTolerance" class="slider" min="0.1" max="10" step="0.1" value="1">
                    </div>

                    <div class="control-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="showEdgeNodes" checked>
                            <span class="checkbox-custom"></span>
                            Show edge nodes
                        </label>
                    </div>

                    <button class="btn-secondary" id="resetBtn">Reset to Default</button>
                </div>
            </section>

            <!-- Export Button - At bottom of sidebar -->
            <button class="btn-export" id="downloadBtn">
                Export SVG
            </button>
        </aside>

        <!-- Canvas Area -->
        <main class="canvas-area">
            <div class="canvas-wrapper">
                <div id="preview" class="preview"></div>
            </div>
        </main>
    </div>

    <script src="graph.js"></script>
</body>
</html>
